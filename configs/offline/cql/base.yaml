# CQL (cql_jax) shared hyperparameters.
# Dataset-specific fields (env, dataset_id, command_type, group) are injected
# per run from configs/offline/_datasets.yaml by the runner script.
project: Offline-Benchmark
name: CQL
checkpoints_path: checkpoints/CQL
device: cuda
seed: 0

alpha_multiplier: 1.0
backup_entropy: false
batch_size: 256
bc_steps: 0
buffer_size: 10000000
cql_clip_diff_max: .inf
cql_clip_diff_min: -.inf
cql_importance_sample: true
cql_lagrange: true
cql_max_target_backup: true
cql_alpha: 10.0
cql_n_actions: 10
cql_target_action_gap: -1.0
cql_temp: 1.0
discount: 0.99
eval_freq: 5000
max_timesteps: 1000000
n_episodes: 10
normalize: false
normalize_reward: false
orthogonal_init: true
policy_lr: 3.0e-05
qf_lr: 0.0003
soft_target_update_rate: 0.005
target_update_period: 1
q_n_hidden_layers: 3
reward_scale: 1.0
reward_bias: 0.0
use_automatic_entropy_tuning: true
load_model: ''
