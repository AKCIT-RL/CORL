# TD3+BC (td3_bc_jax) shared hyperparameters.
# Dataset-specific fields (env, dataset_id, command_type, group) are injected
# per run from configs/offline/_datasets.yaml by the runner script.
project: Offline-Benchmark
name: TD3-BC
checkpoints_path: checkpoints/TD3-BC
device: cuda
seed: 0

alpha: 2.5
batch_size: 256
buffer_size: 10000000
discount: 0.99
eval_freq: 5000
expl_noise: 0.1
max_timesteps: 1000000
n_episodes: 10
noise_clip: 0.5
normalize: false
normalize_reward: false
policy_freq: 2
policy_noise: 0.2
tau: 0.005
load_model: ''
