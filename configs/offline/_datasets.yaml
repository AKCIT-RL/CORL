# Dataset registry for the offline benchmark (datasets/playground).
#
# One entry per task_id (the folder name under datasets/playground). These
# fields are shared across ALL algorithms and ALL difficulties, so they live
# here once instead of being duplicated in every per-run config.
#
#   env                gym / mujoco_playground env id used for evaluation
#   command_type       command override for joystick envs (null = none)
#   dt_target_returns  Decision Transformer eval targets [high, lower],
#                      derived from the expert dataset return (~[peak, 0.95*peak])
#   eval_shift         (optional) Tier-5 shifted evaluation. Flattened-dotted-key
#                      env config overrides applied ONLY at eval time to build a
#                      harder / held-out regime than the one seen in the dataset
#                      (e.g. stronger push-recovery kicks). Normalization still
#                      uses the in-distribution dataset refs, so the resulting
#                      eval/shifted_final_score is directly comparable to
#                      eval/final_score and their difference is the robustness gap.
#
# The dataset_id passed to minari is:  playground/<task_id>/<difficulty>-v0
# (env and command_type are also stored in each dataset's metadata.json).

difficulties: [expert, medium, medium-expert, medium-replay]

tasks:
  go2-getup:
    env: Go2Getup
    command_type: null
    dt_target_returns: [18, 17]
  go2-getup-walk:
    env: Go2GetupWalk
    command_type: null
    dt_target_returns: [98, 93]
  go2-footstand:
    env: Go2Footstand
    command_type: null
    dt_target_returns: [20, 19]
  go2-handstand:
    env: Go2Handstand
    command_type: null
    dt_target_returns: [20, 19]
  go2-push-recovery:
    env: Go2PushRecovery
    command_type: null
    dt_target_returns: [21, 20]
    # Tier-5 shifted eval: held-out, stronger kicks than the collection regime
    # (train pert_config: velocity_kick [8,16], kick_durations [0.05,0.15],
    # kick_wait_times [1,3]). Harder, sharper and more frequent pushes probe
    # extrapolation beyond the perturbation distribution present in the dataset.
    eval_shift:
      pert_config.velocity_kick: [16.0, 24.0]
      pert_config.kick_durations: [0.03, 0.08]
      pert_config.kick_wait_times: [0.5, 1.5]
  go2-joystick-direction:
    env: Go2JoystickFlatTerrain
    command_type: null
    dt_target_returns: [31, 29]
  go2-flat-forward:
    env: Go2JoystickFlatTerrain
    command_type: forwardfixed
    dt_target_returns: [31, 29]
  go2-rough-terrain:
    env: Go2RoughCurriculum
    command_type: null
    dt_target_returns: [46, 44]
    # Tier-5 shifted eval: held-out terrain instance (new procedural seed) at a
    # difficulty range that extrapolates beyond the [0,1] seen in the dataset.
    # Probes robustness to unseen terrain geometry / steeper relief, mirroring
    # the push-recovery "stronger kicks" shift. Reward is unchanged, so the
    # in-distribution dataset refs keep shifted_final_score comparable to
    # final_score (their difference is the robustness gap). NOTE: tile elevation
    # is hard-capped at _MAX_TILE_HEIGHT=0.30, so the amplitude bump mainly
    # stresses rough/stairs (slope saturates at difficulty 1).
    eval_shift:
      terrain.seed: 7
      terrain.difficulty_range: [1.0, 1.6]
  g1-joystick-direction:
    env: G1JoystickFlatTerrain
    command_type: null
    dt_target_returns: [35, 33]
  h1-gait-tracking:
    env: H1JoystickGaitTracking
    command_type: forwardfixed
    dt_target_returns: [134, 127]
