# Calibrated "medium" rung of the sim2real evaluation ladder.
#
# Identical to humanoid_gym.yaml except for the friction range. The paper's
# Friction ~ U(0.1, 2.0) is a TRAINING range: ~21% of draws land below mu = 0.5,
# where no policy can walk, so those episodes score a frozen policy as a failure
# regardless of its quality. Measured on humanoid_gym.yaml: 53-78% critical drop
# rate and worst-5% retention below return_min on all 8 checkpoints.
#
# mu in [0.3, 1.0] spans dry concrete down to a smooth waxed floor, which is the
# plausible reality gap for an indoor/outdoor quadruped. Target for this rung:
# critical drop rate ~20-30% and positive worst-5% retention.

noise:
  # Friction | - | narrowed from the paper's [0.1, 2.0] to a walkable range.
  geom_friction:
    dist: uniform
    type: absolute
    min: 0.3
    max: 1.0

  # Payload | kg | [-5, 5] | additive | Gaussian.
  # XBot-L is ~60 kg against the Go2's 14.8 kg; +-1.0 kg keeps a comparable
  # fraction of body mass and matches Playground's own torso payload range.
  body_mass:
    dist: normal
    type: additive
    min: -1.0
    max: 1.0
    indices: [1]

  # Motor Strength | % | [95, 105] | scaling | Gaussian.
  motor_strength:
    dist: normal
    type: scale
    min: 0.95
    max: 1.05

  # Joint Position | rad | [-0.05, 0.05] | additive | Gaussian.
  joint_angles:
    dist: normal
    type: additive
    min: -0.05
    max: 0.05

  # Joint Velocity | rad/s | [-0.5, 0.5] | additive | Gaussian.
  joint_vel:
    dist: normal
    type: additive
    min: -0.5
    max: 0.5

  # Angular Velocity | rad/s | [-0.1, 0.1] | additive | Gaussian.
  gyro:
    dist: normal
    type: additive
    min: -0.1
    max: 0.1

  # Euler Angle | rad | [-0.03, 0.03] | additive | Gaussian.
  # The Go2 observes projected gravity rather than Euler angles; for small tilts
  # a 0.03 rad error maps to ~0.03 on the unit vector.
  gravity:
    dist: normal
    type: additive
    min: -0.03
    max: 0.03

# System Delay | ms | [0, 10] | uniform.
action_factory:
  type: randomized_delay
  max_delay: 1
