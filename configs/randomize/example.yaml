noise:
  gyro: 
    dist: uniform
    type: scale
    min: 0.95
    max: 1.05
  gravity: 
    dist: normal
    type: scale
    min: 0.95
    max: 1.05
  joint_angles: 
    dist: uniform
    type: additive
    min: -0.05
    max: 0.05
  joint_vel: 
    dist: normal
    type: additive
    min: -0.3
    max: 0.3
  linvel: 
    dist: uniform
    type: scale
    min: 0.90
    max: 1.1

bias:
  dist: uniform
  min: -0.1
  max: 0.1

quantization: 3

action_factory:
  type: smoothing
  alpha: 0.9

