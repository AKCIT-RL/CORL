[project]
name = "corl"
version = "0.1.0"
description = "High-quality single-file implementations of SOTA Offline and Offline-to-Online RL algorithms"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "jax[cuda12]==0.6.0",
    "mediapy==1.2.4",
    "minari[all]==0.5.3",
    "pandas==2.3.2",
    "playground",
    "pyrallis==0.3.1",
    "torch==2.8.0",
    "tqdm==4.67.1",
    "wandb==0.25.1",
    "mujoco==3.7.0.dev895794022",
]

[tool.uv]

[[tool.uv.index]]
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "mujoco-nightly"
url = "https://py.mujoco.org/"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
playground = { git = "https://github.com/AKCIT-RL/mujoco_playground.git", rev = "go2" }
mujoco = { index = "mujoco-nightly" }

[dependency-groups]
minimum = [
    "cloudpickle==3.1.2",
    "distrax==0.1.5",
    "flax==0.10.7",
    "jax[cuda12]==0.6.0",
]

isaac-minimum = [
    "cloudpickle==3.1.2",
    "distrax==0.1.5",
    "flax==0.10.7",
    "jax[cuda12]==0.6.0",
    "numpy==1.26.0",
]

isaac-test = [
    "cloudpickle==3.1.2",
    "distrax==0.1.5",
    "flax==0.10.7",
    "jax[cuda12]==0.6.0",
    "numpy==1.26.0",
    "playground",
    "minari[all]==0.5.3",
    "torch==2.8.0",
    "tqdm==4.67.1",
]

[tool.uv.dependency-groups]
isaac-minimum = {requires-python = "==3.11.13"}
isaac-test = {requires-python = "==3.11.13"}